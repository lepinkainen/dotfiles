<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Package search</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; }
  #results li { padding: 4px 0; }
</style>
</head>
<body>
  <h1>Package search</h1>
  <form id="search-form">
    <input type="search" id="q" placeholder="package name">
    <button type="submit">Search</button>
  </form>
  <ul id="results"></ul>
  <script>
    document.getElementById("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = document.getElementById("q").value;
      const res = await fetch(`https://registry.npmjs.org/-/v1/search?text=${encodeURIComponent(q)}&size=10`);
      const data = await res.json();
      const ul = document.getElementById("results");
      ul.innerHTML = "";
      for (const obj of data.objects) {
        const li = document.createElement("li");
        li.textContent = `${obj.package.name} — ${obj.package.description ?? ""}`;
        ul.appendChild(li);
      }
    });
  </script>
</body>
</html>
